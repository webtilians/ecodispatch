name: Generate v1.7.1 historical replay results

on:
  push:
    branches: ["feature/historical-demand-replay-v1.7.1"]
    paths:
      - "web/historical-demand-core.js"
      - "scripts/run_historical_demand_v1_7_1.cjs"
      - "tests/historical-demand.test.cjs"
      - "tests/test_historical_routing_v1_7_1.py"
      - ".github/workflows/historical-replay-v1.7.1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "historical-replay-v1.7.1-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify all pre-outcome frozen inputs
        run: |
          python scripts/verify_historical_demand_v1_7_1.py
          python -m unittest tests.test_historical_routing_v1_7_1

      - name: Validate replay core before outcomes
        run: node tests/historical-demand.test.cjs

      - name: Run historical demand replay
        run: node scripts/run_historical_demand_v1_7_1.cjs

      - name: Validate generated files
        run: |
          test -s web/data/historical-demand-v1.7.1.json
          test -s web/data/historical-demand-v1.7.1.csv
          test -s results/historical-demand-v1.7.1-report.md
          git diff --check

      - name: Commit exploratory replay outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/historical-demand-v1.7.1.json
          git add web/data/historical-demand-v1.7.1.csv
          git add results/historical-demand-v1.7.1-report.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "v1.7.1: add historical demand replay results"
            git push origin HEAD:feature/historical-demand-replay-v1.7.1
          fi
