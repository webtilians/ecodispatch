name: Generate v1.5 temporal fire benchmark

on:
  push:
    branches: ["feature/temporal-fire-v1.5"]
    paths:
      - "data/temporal-fire-v1.5/protocol.json"
      - "web/temporal-fire-core.js"
      - "scripts/run_temporal_fire_benchmark.cjs"
      - ".github/workflows/temporal-fire-v1.5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporal-fire-v1.5
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate fixed-design temporal benchmark
        run: node scripts/run_temporal_fire_benchmark.cjs
      - name: Sanity-check outputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('web/data/temporal-fire-v1.5.json','utf8'));
          if(x.version!=='1.5'||x.confirmatory!==false||x.snapshots.length!==6)throw Error('bad v1.5 output');
          for(const s of x.snapshots){
            if(s.summary.length!==7)throw Error('missing policies');
            for(const p of s.summary){
              for(const k of ['coverage','unserved','totalHarm','utilizationMean']){
                if(!Number.isFinite(p.absolute[k].mean))throw Error('non-finite '+k);
              }
            }
          }
          console.log('v1.5 sanity OK');
          NODE
      - name: Commit generated benchmark
        run: |
          if [ -z "$(git status --porcelain -- web/data/temporal-fire-v1.5.json web/data/temporal-fire-v1.5.csv results/temporal-fire-v1.5-report.md)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/temporal-fire-v1.5.json web/data/temporal-fire-v1.5.csv results/temporal-fire-v1.5-report.md
          git commit -m "Generate fixed-design v1.5 temporal fire results"
          git push
