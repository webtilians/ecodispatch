name: Deploy EcoDispatch dashboard

on:
  push:
    branches: ["master", "feature/real-fire-derived-v1.7"]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "requirements-spatial.txt"
      - "package-lock.json"
      - ".gitattributes"
      - "tests/**"
      - "docs/**"
      - "results/**"
      - "README.md"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install spatial dependencies
        run: python -m pip install -r requirements-spatial.txt

      - name: Reproduce frozen spatial extraction and exploratory study offline
        run: |
          python scripts/build_spatial_hazard.py
          node scripts/run_spatial_benchmark.cjs
          git diff --exit-code -- web/data/spatial-hazard-v1.3.json web/data/spatial-benchmark-v1.3.json results/spatial-hazard-v1.3-rows.json results/spatial-hazard-v1.3-report.md

      - name: Reproduce locked v1.4 fire experiment offline
        run: |
          python scripts/build_fire_snapshots.py
          node scripts/run_fire_benchmark.cjs
          git diff --exit-code -- web/data/fire-snapshots-v1.4.json web/data/fire-benchmark-v1.4.json web/data/fire-benchmark-v1.4.csv results/fire-dispatch-v1.4-rows.json results/fire-dispatch-v1.4-report.md

      - name: Reproduce fixed-design v1.5 temporal fire experiment offline
        run: |
          node scripts/run_temporal_fire_benchmark.cjs
          git diff --exit-code -- web/data/temporal-fire-v1.5.json web/data/temporal-fire-v1.5.csv results/temporal-fire-v1.5-report.md

      - name: Reproduce fixed-design v1.6 robustness surface offline
        run: |
          node scripts/run_temporal_robustness_v1_6.cjs
          git diff --exit-code -- web/data/temporal-robustness-v1.6.json web/data/temporal-robustness-v1.6.csv results/temporal-robustness-v1.6-report.md

      - name: Reproduce and validate real incident extraction offline
        run: python scripts/build_real_fire_v1_7.py --check

      - name: Rebuild and verify frozen v1.7.1 historical demand cohort
        run: |
          python scripts/build_historical_demand_v1_7_1.py
          python scripts/verify_historical_demand_v1_7_1.py

      - name: Reproduce frozen v1.7.1 historical demand replay offline
        run: |
          python -m unittest tests.test_historical_routing_v1_7_1
          node tests/historical-demand.test.cjs
          node scripts/run_historical_demand_v1_7_1.cjs
          git diff --exit-code -- web/data/historical-demand-v1.7.1.json web/data/historical-demand-v1.7.1-summary.json web/data/historical-demand-v1.7.1.csv results/historical-demand-v1.7.1-report.md

      - name: Upload v1.7.1 cohort candidate
        uses: actions/upload-artifact@v4
        with:
          name: historical-demand-v1.7.1-${{ github.sha }}
          path: |
            data/historical-demand-v1.7.1/cohort.json
            results/historical-demand-v1.7.1-cohort.md

      - name: Validate paired study, model regression, translations and syntax
        run: |
          node tests/ablation.test.cjs
          node tests/holdout.test.cjs
          node tests/real-routing.test.cjs
          node tests/real-routing-holdout.test.cjs
          node tests/real-hazard.test.cjs
          node tests/spatial-hazard.test.cjs
          node tests/fire-dispatch.test.cjs
          node tests/temporal-fire.test.cjs
          node tests/temporal-robustness.test.cjs
          node tests/historical-demand.test.cjs
          python -m unittest discover -s tests

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser integration test
        run: npm run test:e2e

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
