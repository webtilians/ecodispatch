name: Deploy EcoDispatch dashboard

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "requirements-spatial.txt"
      - "package-lock.json"
      - ".gitattributes"
      - "tests/**"
      - "docs/**"
      - "results/**"
      - "README.md"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install spatial dependencies
        run: python -m pip install -r requirements-spatial.txt

      - name: Reproduce frozen spatial extraction and exploratory study offline
        run: |
          python scripts/build_spatial_hazard.py
          node scripts/run_spatial_benchmark.cjs
          git diff --exit-code -- web/data/spatial-hazard-v1.3.json web/data/spatial-benchmark-v1.3.json results/spatial-hazard-v1.3-rows.json results/spatial-hazard-v1.3-report.md

      - name: Validate paired study, model regression, translations and syntax
        run: |
          node tests/ablation.test.cjs
          node tests/holdout.test.cjs
          node tests/real-routing.test.cjs
          node tests/real-routing-holdout.test.cjs
          node tests/real-hazard.test.cjs
          node tests/spatial-hazard.test.cjs
          python -m unittest discover -s tests

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser integration test
        run: npm run test:e2e

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
