name: Deploy EcoDispatch dashboard

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "results/**"
      - "README.md"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate paired study, model regression, translations and syntax
        run: |
          node tests/ablation.test.cjs
          node tests/holdout.test.cjs
          python -m unittest discover -s tests

      - name: Set up Node for browser integration tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser integration test
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
